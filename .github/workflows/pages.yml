name: Test and deploy Brasswake

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/work/playwright-browsers

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      ui: ${{ steps.verify.outputs.ui }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install game dependencies
        working-directory: game
        run: npm ci
      - name: Verify art, game and build; select required browser coverage
        id: verify
        working-directory: game
        env:
          BW_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run verify -- --defer-ui
      - name: Retain core test selection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-verification
          path: |
            work/test-selection.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: game/dist

  browser:
    if: needs.core.outputs.ui == 'true'
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: phone-chromium
            browser: chromium
          - project: phone-webkit
            browser: webkit
          - project: desktop-chromium
            browser: chromium
    steps:
      - name: Check out the same source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install locked dependencies
        working-directory: game
        run: npm ci
      - name: Build the exact source for this profile
        working-directory: game
        run: npm run build
      - name: Install this profile's browser
        working-directory: game
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify all cases in this profile
        working-directory: game
        run: npx playwright test --project=${{ matrix.project }}
      - name: Retain profile evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.project }}
          path: |
            game/playwright-report/
            game/test-results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    if: always() && !cancelled()
    needs: [core, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the validation gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Require core and every selected browser profile
        env:
          BW_CORE_RESULT: ${{ needs.core.result }}
          BW_UI_SELECTED: ${{ needs.core.outputs.ui }}
          BW_BROWSER_RESULT: ${{ needs.browser.result }}
        run: node game/test/release-gate.js

  deploy:
    if: always() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.core.result == 'success' && needs.build.result == 'success'
    needs: [core, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source for live verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install live test dependencies
        working-directory: game
        run: npm ci
      - name: Install live browser when UI verification is relevant
        if: needs.core.outputs.ui == 'true'
        working-directory: game
        run: npx playwright install --with-deps chromium
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify deployed commit and relevant game behavior
        working-directory: game
        env:
          BW_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          BW_EXPECT_COMMIT: ${{ github.sha }}
          BW_LIVE_UI: ${{ needs.core.outputs.ui }}
        run: npm run test:live
      - name: Retain live verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-verification
          path: |
            game/playwright-report-live/
            game/test-results-live/
            work/live-release.json
          if-no-files-found: ignore
          retention-days: 14
