<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brasswake outfit proof</title>
<style>
:root { color-scheme: light; background: #e8e1d2; color: #383229; font: 16px system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 32rem; margin: auto; padding: 0 0 20px; }
h1 { font: bold 1.55rem Georgia, serif; margin: 14px 14px 12px; }
fieldset { border: 0; padding: 0; margin: 9px 14px; display: flex; gap: 7px; flex-wrap: wrap; }
legend { padding: 0; margin-bottom: 6px; font-size: .88rem; }
button { border: 1px solid #877963; border-radius: 5px; background: #f5efe3; color: inherit;
  font: inherit; min-height: 42px; padding: 6px 10px; }
button[aria-pressed="true"] { background: #4c4131; color: #fff9eb; }
button:focus-visible { outline: 2px solid #325675; outline-offset: 2px; }
button:disabled { opacity: .5; }
output { align-self: center; font-variant-numeric: tabular-nums; font-size: .9rem; }
canvas, #doll-image { display: block; width: min(100%, 390px); height: auto; margin: auto; }
#doll-image { width: min(100%, 500px); }
[hidden] { display: none !important; }
</style>
<main>
  <h1>Brasswake outfit proof</h1>
  <fieldset id="outfits"><legend>Outfit</legend></fieldset>
  <fieldset><button id="doll" aria-pressed="false">Paper dolls</button></fieldset>
  <canvas width="390" height="278" aria-label="Paired east-facing outfits enlarged and at town size"></canvas>
  <img id="doll-image" alt="Separately painted frontal figures for both bodies" hidden>
  <fieldset id="motion"><legend>Side gait</legend>
    <button data-gait="walk" aria-pressed="true">Walk</button>
    <button data-gait="run" aria-pressed="false">Run</button>
    <button id="pause">Pause</button>
    <button id="step" disabled>Next frame</button>
    <output id="phase" aria-label="Stride phase"></output>
  </fieldset>
</main>
<script>
const data = __PAYLOAD__;
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const atlas = new Image();
const street = new Image();
atlas.src = data.atlas;
street.src = data.street;
const dolls = document.querySelector('#doll-image');
const output = document.querySelector('#phase');
const pause = document.querySelector('#pause');
const step = document.querySelector('#step');
let look = 0, gait = 'walk', phase = 0, elapsed = 0, previous = 0, playing = true, paper = false;

function updateDolls() {
  if (paper) dolls.src = data.dolls[look];
}

for (const [index, label] of data.labels.entries()) {
  const option = document.createElement('button');
  option.textContent = label;
  option.setAttribute('aria-pressed', index === look);
  option.onclick = () => {
    look = index;
    document.querySelectorAll('#outfits button').forEach(item =>
      item.setAttribute('aria-pressed', item === option));
    updateDolls();
  };
  document.querySelector('#outfits').append(option);
}

document.querySelector('#doll').onclick = event => {
  paper = !paper;
  event.currentTarget.setAttribute('aria-pressed', paper);
  canvas.hidden = paper;
  dolls.hidden = !paper;
  document.querySelector('#motion').hidden = paper;
  updateDolls();
};

for (const option of document.querySelectorAll('[data-gait]')) {
  option.onclick = () => {
    gait = option.dataset.gait;
    elapsed = 0;
    document.querySelectorAll('[data-gait]').forEach(item =>
      item.setAttribute('aria-pressed', item === option));
  };
}
pause.onclick = () => {
  playing = !playing;
  pause.textContent = playing ? 'Pause' : 'Play';
  step.disabled = playing;
};
step.onclick = () => {
  phase = (phase + 1) % 8;
  elapsed = 0;
};

function actor(row, x, y, scale) {
  const {cell, ground} = data;
  const column = (gait === 'run' ? 8 : 0) + phase;
  ctx.drawImage(atlas, column * cell, (look * 2 + row) * cell, cell, cell,
    x - cell * scale / 2, y - ground * scale, cell * scale, cell * scale);
}

function render(now) {
  if (playing && !paper && previous) elapsed += Math.min(now - previous, 100);
  previous = now;
  const timing = data.delays[gait];
  while (elapsed >= timing[phase]) {
    elapsed -= timing[phase];
    phase = (phase + 1) % 8;
  }
  if (!paper) {
    ctx.fillStyle = '#e8e1d2';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(street, 0, 164);
    for (let row = 0; row < 2; row++) {
      actor(row, 115 + row * 155, 158, 1);
      actor(row, 156 + row * 85, 264, data.townHeights[row] / data.heights[row]);
    }
    output.value = (phase + 1) + ' / 8';
  }
  requestAnimationFrame(render);
}
Promise.all([atlas.decode(), street.decode()]).then(() => requestAnimationFrame(render));
</script>
</html>
