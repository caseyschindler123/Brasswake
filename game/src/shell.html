<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1c11">
<meta name="brasswake-release" content="/*RELEASE*/">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="art/app/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="art/app/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Brasswake">
<title>Brasswake Ledger RPG</title>
<style>
/*CSS*/
</style>
</head>
<body>
<div id="app">
  <div id="save-warning" role="alert" hidden>Progress could not be saved. <button data-a="backup">Back up save</button></div>
  <header id="hud"></header>
  <div id="stage"><div class="stage-ui"><button class="obj" data-a="journal"><span class="journal-label">Journal ▾</span><span id="obj">…</span></button><span id="st-hearts" class="hearts"></span></div><button id="ctx" class="btn solid" data-a="act" hidden></button><div id="say" hidden></div><section id="onboard" aria-label="Arrival aboard the Marigold" hidden></section><p id="st-load" class="loading">The Ledger is opening…</p></div>
  <section id="combat-target" aria-label="Selected opponent" hidden></section>
  <section id="combat-result" aria-label="Last action" hidden></section>
  <section id="combat-bar" aria-label="Combat actions" hidden></section>
  <main id="view" tabindex="-1" hidden></main>
  <nav id="nav" aria-label="Game menu"></nav>
  <section id="fight" hidden aria-label="Fight"></section>
  <div id="odq" class="odq" hidden></div>
  <section id="enc" hidden aria-label="Encounter"></section>
  <div id="sheet" hidden><div class="sheet-back" data-a="closesheet"></div><div class="sheet-card" role="dialog" aria-modal="true"><button class="sheet-x" data-a="closesheet" aria-label="Close">Close</button><div id="sheet-body"></div></div></div>
  <section id="title" hidden aria-label="Title"></section>
  <div id="artload" role="status" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="coach" class="coach" role="dialog" hidden></div>
</div>
<script src="vendor/sql-asm.js"></script>
<script>
/*JS*/
</script>
</body>
</html>
