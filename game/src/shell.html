<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brasswake Ledger RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
/*CSS*/
</style>
</head>
<body>
<div id="app">
  <header id="hud"></header>
  <div id="stage"><div class="stage-ui"><button class="obj" data-a="journal"><span id="obj">…</span></button><span id="st-hearts" class="hearts"></span></div><button id="ctx" class="btn solid" data-a="act" hidden></button><div id="say" hidden></div><p id="st-load" class="loading">The Ledger is opening…</p></div>
  <main id="view" tabindex="-1" hidden></main>
  <nav id="nav" aria-label="Game menu"></nav>
  <section id="fight" hidden aria-label="Fight"></section>
  <div id="odq" class="odq" hidden></div>
  <section id="enc" hidden aria-label="Encounter"></section>
  <div id="sheet" hidden><div class="sheet-back" data-a="closesheet"></div><div class="sheet-card" role="dialog" aria-modal="true"><button class="sheet-x" data-a="closesheet" aria-label="Close">Close</button><div id="sheet-body"></div></div></div>
  <section id="title" hidden aria-label="Title"></section>
  <div id="artload" role="status" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="coach" class="coach" role="dialog" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-asm.js"></script>
<script>
/*JS*/
</script>
</body>
</html>
